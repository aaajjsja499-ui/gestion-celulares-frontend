<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1f3a5f" />
  <title>Gestión de Celulares</title>
  <link rel="stylesheet" href="css/app.css" />
</head>
<body>
  <div id="login" hidden>
    <form id="form-login" autocomplete="on">
      <h1>Gestión de Celulares</h1>
      <p id="login-aviso" class="aviso" hidden></p>
      <label>Email<input type="email" id="login-email" autocomplete="username" required /></label>
      <label>PIN<input type="password" id="login-pin" inputmode="numeric" autocomplete="current-password" required /></label>
      <button type="submit" class="btn primario">Ingresar</button>
      <p id="login-error" class="error" hidden></p>
    </form>
  </div>

  <div id="app" hidden>
    <header id="barra">
      <button id="atras" class="icono" hidden aria-label="Volver">‹</button>
      <h1 id="titulo">Inicio</h1>
      <span id="usuario"></span>
    </header>
    <main id="contenido"></main>
    <nav id="tabs"></nav>
  </div>
  <div id="capas"></div>

  <script src="config.js"></script>
  <script src="js/core/util.js"></script>
  <script src="js/core/api.js"></script>
  <script src="js/core/ui.js"></script>
  <script src="js/core/app.js"></script>
  <script src="js/pantallas/inicio.js"></script>
  <script src="js/pantallas/equipo.js"></script>
  <script src="js/pantallas/vender.js"></script>
  <script src="js/pantallas/clientes.js"></script>
  <script src="js/pantallas/cartera.js"></script>
  <script src="js/pantallas/taller.js"></script>
  <script src="js/pantallas/ordenes.js"></script>
  <script src="js/pantallas/repuestos.js"></script>
  <script src="js/pantallas/dinero.js"></script>
  <script src="js/pantallas/mas.js"></script>
  <script>App.iniciar();</script>
</body>
</html>
